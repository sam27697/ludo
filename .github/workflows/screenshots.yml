name: screenshots

# Manually triggered only. This boots a real Android emulator, which is slow
# and burns minutes verify.yml has no business spending on every push, so it
# never runs on push or pull_request -- only when a human asks for it, after
# a change that might have moved one of the three captured screens.
on:
  workflow_dispatch: {}

jobs:
  screenshots:
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ludo_client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: "stable"

      - run: flutter pub get

      # Cheap check before the expensive one. The emulator step below takes
      # minutes to boot; if the driver or target file it points flutter
      # drive at has moved or been misspelled, this catches it in seconds
      # instead of at the end of that boot. This step runs under the job's
      # own `defaults.run.working-directory` (packages/ludo_client), so the
      # paths here are relative to that, not to the repository root.
      - name: confirm the drive script and target exist
        run: |
          set -euo pipefail
          test -f test_driver/integration_test.dart || { echo "missing packages/ludo_client/test_driver/integration_test.dart" >&2; exit 1; }
          test -f integration_test/screenshots_test.dart || { echo "missing packages/ludo_client/integration_test/screenshots_test.dart" >&2; exit 1; }

      # Standard boilerplate from reactivecircus/android-emulator-runner's
      # own README for GitHub-hosted Linux runners: makes /dev/kvm
      # group-writable so the emulator gets hardware acceleration instead of
      # falling back to (very slow, likely to time out) software rendering.
      - name: enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator goes offline mid-run on the stills job (C-641: 6 of 8
      # runs, each at a capture whose board sits under an Opacity layer, no
      # crash line in the job log) and the job keeps nothing but the PNGs.
      # This starts the sampler in the background before the emulator step
      # so a death leaves host and guest memory over time and the logcat
      # around it. A process started in a step keeps running until the job
      # ends, which is how it outlives this step; stdout and stderr go to a
      # file so the step does not wait on them. continue-on-error and the
      # trailing `exit 0`: this must never change the job's result.
      - name: start the emulator watcher
        continue-on-error: true
        env:
          DIAG_DIR: ${{ runner.temp }}/emulator-diag
        run: |
          set +e
          mkdir -p "$DIAG_DIR"
          touch "$DIAG_DIR/start.stamp"
          nohup bash tool/emulator_watch.sh "$DIAG_DIR" > "$DIAG_DIR/watch.stderr" 2>&1 &
          echo $! > "$DIAG_DIR/watch.pid"
          sleep 1
          if kill -0 "$(cat "$DIAG_DIR/watch.pid")" 2>/dev/null; then
            echo "watcher running, pid $(cat "$DIAG_DIR/watch.pid")"
          else
            echo "watcher is not running; see $DIAG_DIR/watch.stderr"
          fi
          exit 0

      # API 34 (Android 14): inside the app's [minSdk 24, targetSdk 36]
      # range, and picked over something closer to 36 because it is a level
      # this action and the emulator's KVM acceleration are long
      # established against on ubuntu-latest -- targetSdk 36 is what the app
      # ships against, not a requirement that screenshots be captured on
      # that exact platform version.
      #
      # profile: "Nexus 5" is an AVD hardware profile whose documented
      # screen spec is 1080x1920 -- Play's accepted phone screenshot
      # resolution, and the same physical spec as the real device it is
      # named after. Neither this API level nor this profile has been
      # booted by the worker that wrote this workflow: there is no Android
      # SDK in that worker's container, so this is the best-supported choice
      # available, not one confirmed against a live run.
      - name: boot the emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: "Nexus 5"
          disable-animations: true
          # The script runs from the repository root regardless of this
          # job's own `defaults.run.working-directory` (that default applies
          # to plain `run:` steps, not to what a composite action does
          # internally), so it changes into the client package itself
          # before calling flutter drive. android-emulator-runner passes
          # each line of `script:` to its own `sh -c`, not to one shell, so
          # the `cd` and the drive invocation must be joined on a single
          # line with `&&` -- two lines here would run in two separate
          # shells and the second would never see the first's `cd`.
          #
          # --profile: flutter drive builds debug by default, and debug
          # mode is what draws the red DEBUG ribbon MaterialApp shows
          # over every screen -- not acceptable on a store screenshot.
          # --release is not an option here because it strips the Dart
          # VM service that flutter drive needs to talk to the running
          # app, which breaks the driver connection. Profile mode keeps
          # the VM service and turns the banner off, which is the pair
          # of properties a captured screenshot needs. This is still one
          # folded YAML scalar (`>-`), so the flag is its own line here
          # but still lands in the single-line script the runner sees.
          script: >-
            cd packages/ludo_client &&
            flutter drive
            --profile
            --driver=test_driver/integration_test.dart
            --target=integration_test/screenshots_test.dart
            -d emulator-5554

      # `if: always()`: the evidence matters most when the step above went
      # red. Stops the watcher by its PID file (checked against its command
      # line first, so a reused PID is never signalled), then gathers what
      # only the host has: the kernel log (did it run out of memory, did it
      # kill or crash qemu) and any crash files the emulator left since the
      # start stamp. summary.txt is the one-screen answer; the raw files sit
      # next to it. Every command tolerates failure and the step ends with
      # `exit 0`, so the job's result stays what the steps above decided.
      - name: stop the emulator watcher and collect host evidence
        if: always()
        continue-on-error: true
        env:
          DIAG_DIR: ${{ runner.temp }}/emulator-diag
        run: |
          set +e
          mkdir -p "$DIAG_DIR/crash"
          wpid=$(cat "$DIAG_DIR/watch.pid" 2>/dev/null)
          case "$wpid" in
            '' | *[!0-9]*) echo "no usable watch.pid: '$wpid'" ;;
            *)
              if tr '\0' ' ' < "/proc/$wpid/cmdline" 2>/dev/null | grep -q emulator_watch; then
                kill -TERM "$wpid"
                for _ in $(seq 1 20); do
                  kill -0 "$wpid" 2>/dev/null || break
                  sleep 0.5
                done
                if kill -0 "$wpid" 2>/dev/null; then
                  kill -KILL "$wpid"
                  echo "watcher $wpid needed SIGKILL"
                else
                  echo "watcher $wpid stopped"
                fi
              else
                echo "watcher $wpid was not running at job end"
              fi
              ;;
          esac

          sudo -n dmesg -T > "$DIAG_DIR/dmesg.txt" 2>&1
          dmesg_rc=$?

          # Looked at: ~/.android, /tmp and $RUNNER_TEMP (not the diag dir
          # itself) for files newer than start.stamp named *.dmp, *crash* or
          # emu-*; and the AVD's *.log under ~/.android/avd. Files over 64 MB
          # are skipped. Copies are flattened so the hidden ~/.android path
          # component does not make the artifact upload drop them.
          rt="${RUNNER_TEMP:-$(dirname "$DIAG_DIR")}"
          {
            echo "dirs: $HOME/.android /tmp $rt (excluding $DIAG_DIR)"
            echo "names: *.dmp *crash* emu-*, and $HOME/.android/avd *.log"
            echo "newer than: $DIAG_DIR/start.stamp"
          } > "$DIAG_DIR/crash/searched.txt"
          {
            find "$HOME/.android" /tmp "$rt" -maxdepth 6 -path "$DIAG_DIR" -prune -o \
              -type f -newer "$DIAG_DIR/start.stamp" -size -64M \
              \( -name '*.dmp' -o -name '*crash*' -o -name 'emu-*' \) -print
            find "$HOME/.android/avd" -type f -newer "$DIAG_DIR/start.stamp" -size -64M -name '*.log' -print
          } 2>/dev/null | sort -u > "$DIAG_DIR/crash/found.txt"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            flat=$(printf '%s' "$f" | sed 's#^/##; s#/#__#g; s#^\.##')
            cp -p "$f" "$DIAG_DIR/crash/$flat" 2>/dev/null
          done < "$DIAG_DIR/crash/found.txt"

          hl="$DIAG_DIR/host.log"
          gl="$DIAG_DIR/guest.log"
          lc="$DIAG_DIR/logcat.txt"
          dm="$DIAG_DIR/dmesg.txt"
          cnt() { if [ -s "$2" ]; then grep -c -E "$1" "$2"; else echo "n/a (no data)"; fi; }
          {
            if [ "$dmesg_rc" -eq 0 ]; then
              echo "dmesg: $(cnt 'Out of memory|oom-kill|Killed process|segfault' "$dm") lines matching Out of memory, oom-kill, Killed process, segfault"
            else
              echo "dmesg: unavailable (sudo dmesg exit $dmesg_rc)"
            fi
            echo "logcat: $(cnt "FATAL EXCEPTION|lowmemorykiller|lmkd|Kill '|am_kill|am_proc_died" "$lc") lines matching FATAL EXCEPTION, lowmemorykiller, lmkd, Kill ', am_kill, am_proc_died"
            echo "peak qemu rss: $(awk '/^=== /{t=$2} $1 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && $8 ~ /qemu-system/ && $3 > m {m=$3; at=t} END{ if (m) printf "%d KiB (%d MiB) at %s", m, m/1024, at; else print "n/a (no qemu process sampled)" }' "$hl" 2>/dev/null)"
            echo "lowest host available: $(awk '/^=== /{t=$2} $1 == "Mem:" && (min == "" || $7 + 0 < min + 0) {min=$7; at=t} END{ if (min != "") printf "%d MiB at %s", min, at; else print "n/a (no free -m sample)" }' "$hl" 2>/dev/null)"
            echo "last guest sample: $(grep -E '^=== .* guest$' "$gl" 2>/dev/null | tail -n 1 | cut -d' ' -f2)"
            echo "last guest sample with device online: $(awk '/^=== /{t=$2} /^device: online$/{last=t} END{ if (last != "") print last; else print "none" }' "$gl" 2>/dev/null)"
            echo "last host sample: $(grep -E '^=== .* host$' "$hl" 2>/dev/null | tail -n 1 | cut -d' ' -f2)"
            echo "crash files copied: $(grep -c . "$DIAG_DIR/crash/found.txt" 2>/dev/null)"
          } > "$DIAG_DIR/summary.txt"
          cat "$DIAG_DIR/summary.txt"
          exit 0

      # flutter drive's driver adaptor (test_driver/integration_test.dart)
      # writes each captured PNG to screenshots/<name>.png relative to
      # wherever flutter drive itself ran, which the script step above
      # pins to packages/ludo_client. Fails loudly instead of uploading an
      # empty artifact if the emulator step produced nothing.
      - name: confirm the screenshots exist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(screenshots/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no PNGs found under packages/ludo_client/screenshots; the drive step did not produce screenshots" >&2
            exit 1
          fi
          echo "found ${#files[@]} screenshot(s):"
          ls -la "${files[@]}"

      # `if: always()` so this still runs when "boot the emulator and
      # capture screenshots" fails partway through: flutter drive writes
      # each PNG to disk as soon as `takeScreenshot` returns, before the
      # next line of the test runs, so a test that fails on its fourth
      # capture (or its first, or its tap between two captures) has
      # already left the earlier ones on disk. Without `always()` here the
      # default step condition only runs on a fully green job, so every
      # failing run before this fix uploaded nothing at all -- the exact
      # blindness this fix exists to remove.
      #
      # if-no-files-found is `warn`, not `error`. A capture step that fails
      # outright already turns the job red on its own; having the upload
      # step raise a second, differently-worded failure for the same
      # underlying cause (zero PNGs on disk) adds noise, not information.
      # The case this setting exists to catch -- the capture step exiting
      # 0 while silently writing nothing -- is still caught, by the
      # "confirm the screenshots exist" step above, which runs only on the
      # normal success path (it has no `always()`) and still hard-fails
      # the job with `set -euo pipefail; ... exit 1` if it finds zero
      # PNGs there.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: store-screenshots
          path: packages/ludo_client/screenshots/*.png
          if-no-files-found: warn

      # The sampler's output (see "start the emulator watcher"), uploaded on
      # green runs too so a death can be compared against a run without one.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: emulator-diag-stills
          path: ${{ runner.temp }}/emulator-diag
          if-no-files-found: warn

  motion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en, ar]
        seat: [0, 2]
    # Job env, not an assignment inside `script:`. android-emulator-runner
    # passes each script line to its own `sh -c`, which would drop an inline
    # MOTION_LOCALE= or MOTION_SEAT= before record_motion.sh starts.
    env:
      MOTION_LOCALE: ${{ matrix.locale }}
      MOTION_SEAT: ${{ matrix.seat }}
    defaults:
      run:
        working-directory: packages/ludo_client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: "stable"

      - run: flutter pub get

      # Cheap check before the expensive emulator boot. Catches a missing or
      # misspelled driver or target script in seconds instead of after minutes
      # of boot time.
      - name: confirm the drive script and target exist
        run: |
          set -euo pipefail
          test -f test_driver/integration_test.dart || { echo "missing packages/ludo_client/test_driver/integration_test.dart" >&2; exit 1; }
          test -f integration_test/motion_test.dart || { echo "missing packages/ludo_client/integration_test/motion_test.dart" >&2; exit 1; }

      # Standard boilerplate from reactivecircus/android-emulator-runner's
      # own README for GitHub-hosted Linux runners: makes /dev/kvm
      # group-writable so the emulator gets hardware acceleration instead of
      # falling back to (very slow, likely to time out) software rendering.
      - name: enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Boots an emulator with animations enabled so integration_test/motion_test.dart
      # captures the actual motion curves (die tumble, token travel, capture flight)
      # rather than the reduced-motion cuts captured by screenshots.
      #
      # android-emulator-runner passes each script line to its own `sh -c`, so
      # the background recorder, drive invocation, signal handling and artifact
      # verification all live in record_motion.sh.
      - name: boot the emulator and record motion
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: "Nexus 5"
          disable-animations: false
          script: bash packages/ludo_client/tool/record_motion.sh

      # `if: always()` so artifacts and drive logs collected up to any point of
      # failure are uploaded for diagnosis rather than lost.
      #
      # if-no-files-found is `warn`, not `error`. record_motion.sh already
      # fails the job if flutter drive failed or no mp4 was larger than 200 KB.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: motion-recording-${{ matrix.locale }}-seat${{ matrix.seat }}
          path: packages/ludo_client/motion/*
          if-no-files-found: warn
