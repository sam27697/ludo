name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - run: dart pub get
      - run: bash bin/ludo-verify.sh

  # Builds the server image on every push, exactly the way deploy/ludo/deploy.sh
  # builds it and exactly the way gate_artifact in bin/ludo-verify.sh builds it
  # when a docker daemon is available to that script. Kept as its own job, not
  # folded into `verify` or `client`, for the same reason `client` is separate:
  # when this goes red it must be unambiguous that the server image build is
  # what broke, not the Dart harness and not the Android client.
  #
  # This is the check that would have caught packages/fair_dice joining the pub
  # workspace without also joining the Dockerfile's COPY list -- main sat
  # unbuildable with nothing to say so until someone tried to deploy it. The
  # image is never pushed anywhere and nothing here logs in to a registry;
  # building it to prove it builds is the entire point.
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f packages/ludo_server/Dockerfile -t ludo-server:ci .

  # packages/ludo_client is a standalone Flutter package, not a member of the
  # root pub workspace (see packages/ludo_client/pubspec.yaml and the root
  # pubspec.yaml for why: a Flutter package as a workspace member drags a
  # `sdk: flutter` dependency into the workspace resolution, which breaks
  # `dart pub get` at the root on a Dart-only machine, and the verify job
  # above must keep working with no Flutter installed). This job builds and
  # tests it on its own, in its own working directory, entirely separately
  # from the Dart harness, so the two fail independently and it is obvious
  # which one broke.
  #
  # Whether the bundle this job produces is upload-signed depends entirely on
  # whether the four LUDO_UPLOAD_* secrets below are configured on this
  # repository (LUDO_UPLOAD_KEYSTORE_B64, LUDO_UPLOAD_STORE_PASSWORD,
  # LUDO_UPLOAD_KEY_PASSWORD, LUDO_UPLOAD_CERT_SHA256 -- the key alias is not
  # among them, it is the literal "upload" in the job below, not a secret).
  # When they are set, the release build signs with the real upload keystore
  # (materialised from secrets for the duration of this job only, never
  # committed), the resulting .aab's signer certificate is checked against
  # LUDO_UPLOAD_CERT_SHA256, and only then is it uploaded as a workflow
  # artifact. When they are not -- a fork build has no access to this
  # repository's secrets -- the release build still runs with the Flutter
  # template's debug signing config, so compilation is still proved on every
  # push, and nothing is uploaded. A debug-signed bundle must never reach
  # the artifact list: the next person to find it there will try to submit
  # it to Play.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ludo_client
    steps:
      # fetch-depth: 0 -- the version code computed below is
      # `git rev-list --count HEAD`, and the default shallow checkout
      # (depth 1) would return 1 no matter how large the repository's real
      # history is.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test

      # integration_test/ is a real dev_dependency from the Flutter SDK
      # (packages/ludo_client/pubspec.yaml), not a folder `flutter test` on
      # its own reaches, and nothing else in this workflow or in
      # screenshots.yml runs on every push -- screenshots.yml only runs when
      # a human dispatches it by hand, to drive a real emulator for store
      # images. That gap is what let RoomScreen stop being reachable from
      # screenshots_test.dart for eleven days and sixty-odd merges with
      # nothing going red. This step is the fix: every finder, tap, pushed
      # frame and assertion in integration_test/ still executes headlessly
      # under the flutter-tester device, so a change that breaks the path
      # the screenshot rig walks turns this red on the push that broke it.
      # The capture call itself does nothing useful off-device, but it is
      # not a no-op either -- it still calls its platform channel, and each
      # file run here carries its own headless guard for that.
      #
      # `flutter test -d flutter-tester integration_test/` -- the whole
      # directory in one invocation -- does not work on this Flutter
      # version: it fails to launch a second app instance for a second file,
      # measured failing identically here and on an unconstrained GitHub
      # runner, so it is not this project's own memory limits. Each file
      # passes on its own, so this step runs one `flutter test -d
      # flutter-tester` process per file instead of one process for the
      # whole directory. `-d flutter-tester` is required either way: this
      # package has no linux/ desktop scaffold, so the bare `flutter test`
      # form fails every file here with "No supported devices connected".
      #
      # Files are discovered at run time (integration_test/*_test.dart), not
      # named, so a file added later is covered without anyone remembering
      # to add it here. Every file runs even after an earlier one fails --
      # `if flutter test ...; then ... else ...; fi` is exempt from `set -e`
      # by bash's own rules, which is what keeps the loop going and the
      # summary reachable after a failure, rather than the step dying on the
      # first red file and hiding how many others are also broken. A glob
      # that matches nothing fails the step outright rather than reporting
      # success, which is how this gate could rot exactly the way it exists
      # to prevent.
      - name: integration tests headless, one flutter-tester process per file (a red file below is a screen the app or the screenshot rig can no longer reach)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(integration_test/*_test.dart)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no *_test.dart files found under integration_test/; refusing to report success on an empty or unmatched directory" >&2
            exit 1
          fi
          failed=()
          for f in "${files[@]}"; do
            echo "=== $f ==="
            if flutter test -d flutter-tester "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed+=("$f")
            fi
          done
          echo "=== summary: ${#files[@]} file(s) run, ${#failed[@]} failed ==="
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "all integration_test files passed"

      # bin/ludo-verify.sh resolves $ROOT from its own location, so it must
      # be invoked from the repository root -- working-directory: . overrides
      # this job's own defaults.run.working-directory (packages/ludo_client,
      # set above) for this one step. Runs only the client_wire gate, which
      # starts its own server on 127.0.0.1 and drives
      # packages/ludo_client/tool/wire_smoke.dart against it over a real
      # WebSocket. Placed in this job and not in `verify` because `verify`
      # sets up only the Dart SDK, and this gate needs Flutter to resolve
      # packages/ludo_client's own dependencies; there the gate reports "not
      # implemented" rather than running, which is correct.
      #
      # No LUDO_WIRE_SCENARIO set here, so this step runs the gate's own
      # default and covers only the full-game scenario today, not reconnect.
      # See the comment on gate_client_wire's scenario default in
      # bin/ludo-verify.sh for why, and for when that changes.
      - name: client wire smoke against a locally started server
        working-directory: .
        run: bash bin/ludo-verify.sh client_wire

      # Secrets cannot be referenced directly in a step's `if:` (GitHub's own
      # docs on using secrets in Actions say so explicitly); the supported
      # way to gate steps on a secret being set is to test it once, inside a
      # step that has the secret as an `env:`, and record the answer as a
      # step output the later `if:` conditions can read instead. This step
      # never prints the secret itself, only whether it is empty.
      - name: check whether upload signing material is configured
        id: signing
        env:
          LUDO_UPLOAD_KEYSTORE_B64: ${{ secrets.LUDO_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${LUDO_UPLOAD_KEYSTORE_B64:-}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "LUDO_UPLOAD_KEYSTORE_B64 is set; this run will sign and upload"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "LUDO_UPLOAD_KEYSTORE_B64 is not set; this run builds release-mode only, unsigned, nothing will be uploaded"
          fi

      # Materialises android/key.properties and the PKCS12 keystore it
      # points at from repository secrets, entirely inside this job's own
      # runner filesystem, which is discarded when the job ends. Guarded on
      # the keystore secret being non-empty so a fork build -- which never
      # has access to this repository's secrets -- takes the unsigned
      # fallback path in build.gradle.kts instead of failing on a missing
      # secret. Nothing here is echoed: the keystore comes from a base64
      # decode written straight to a file, and key.properties is written
      # with a redirect, never with `cat` or `echo -n "$VAR"` mixed into a
      # combined line that could show up in a shell trace. There is no
      # `set -x` anywhere in this job.
      #
      # keyAlias is the literal "upload", not a secret. GitHub redacts every
      # occurrence of a secret's value anywhere in a log, including inside
      # step names we wrote ourselves, and the alias used to be
      # LUDO_UPLOAD_KEY_ALIAS with the value "upload" -- so step names like
      # "check whether upload signing material is configured" rendered as
      # "check whether *** signing material is configured". The alias is a
      # lookup name inside a file whose passwords are the actual secrets; it
      # carries no confidentiality of its own, and hard-coding it here is
      # what the keystore generation in docs/RELEASE.md must produce.
      - name: write release signing material
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          LUDO_UPLOAD_KEYSTORE_B64: ${{ secrets.LUDO_UPLOAD_KEYSTORE_B64 }}
          LUDO_UPLOAD_STORE_PASSWORD: ${{ secrets.LUDO_UPLOAD_STORE_PASSWORD }}
          LUDO_UPLOAD_KEY_PASSWORD: ${{ secrets.LUDO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="android/upload-keystore.p12"
          printf '%s' "$LUDO_UPLOAD_KEYSTORE_B64" | base64 -d > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$LUDO_UPLOAD_STORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$LUDO_UPLOAD_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "wrote android/key.properties and $keystore_path; release build will sign with the upload key"

      # Android's version code has to strictly increase across every bundle
      # CI ever builds, or Play refuses the upload as a duplicate of one it
      # has already seen. Computed as the commit count rather than
      # github.run_number: run_number belongs to this workflow file's own
      # identity and resets to 1 if verify.yml is ever renamed or replaced,
      # which would start handing out version codes Play has already taken.
      # The commit count belongs to the repository itself, not to this
      # workflow, and only ever goes up. Requires the checkout above to have
      # fetched full history (fetch-depth: 0) -- a shallow clone returns a
      # truncated count.
      - name: compute version code from commit count
        id: versioncode
        run: |
          set -euo pipefail
          code="$(git rev-list --count HEAD)"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code"

      # LUDO_UPLOAD_VERSION_CODE_FLOOR is the highest Android version code
      # ever built for upload -- 3, from the hand-edited version: 1.0.0+3 in
      # pubspec.yaml, with version code 2 already sitting on the closed
      # testing track. Raise it only when a version code higher than this
      # has genuinely been uploaded to Play; the point of the check below is
      # to stop a wrong or stale computed version code before it reaches
      # Play, not to be adjusted to make the check stop complaining.
      - name: enforce version code floor
        env:
          VERSION_CODE: ${{ steps.versioncode.outputs.version_code }}
        run: |
          set -euo pipefail
          LUDO_UPLOAD_VERSION_CODE_FLOOR=3
          if [ "$VERSION_CODE" -le "$LUDO_UPLOAD_VERSION_CODE_FLOOR" ]; then
            echo "computed version code $VERSION_CODE is not strictly greater than the floor $LUDO_UPLOAD_VERSION_CODE_FLOOR; refusing to build" >&2
            exit 1
          fi
          echo "version code $VERSION_CODE clears the floor of $LUDO_UPLOAD_VERSION_CODE_FLOOR"

      - run: flutter build appbundle --release --build-number=${{ steps.versioncode.outputs.version_code }}

      # The build output must contain exactly one .aab at its canonical
      # output location, and this step fails outright if it does not.
      #
      # build/ holds several .aab files at different pipeline stages -- in
      # particular build/app/intermediates/**/intermediary-bundle.aab, an AGP
      # intermediate written by the packageReleaseBundle task before signing
      # and finalisation run, and unsigned by construction. A bare
      # `find . -name '*.aab' -print -quit` returns whichever match the
      # directory walk reaches first, which on a real run was that
      # intermediate, not the bundle Play would accept -- the signature
      # check downstream caught it as a mismatch, but only because that
      # check exists; nothing about "locate the app bundle: success" said so
      # on its own. Only build/app/outputs/bundle/release holds the actual
      # shipping bundle, so this step is rooted there and nowhere else, and
      # it fails if that directory holds zero or more than one .aab rather
      # than guessing.
      - name: locate the app bundle
        run: |
          set -euo pipefail
          bundle_dir="build/app/outputs/bundle/release"
          if [ ! -d "$bundle_dir" ]; then
            echo "$bundle_dir does not exist; the release build did not produce the shipping bundle output" >&2
            exit 1
          fi
          matches=()
          while IFS= read -r -d '' f; do
            matches+=("$f")
          done < <(find "$bundle_dir" -maxdepth 1 -name '*.aab' -print0)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "no .aab found in $bundle_dir; the release build did not produce one" >&2
            exit 1
          fi
          if [ "${#matches[@]}" -gt 1 ]; then
            echo "more than one .aab found in $bundle_dir, refusing to guess which one ships:" >&2
            printf '%s\n' "${matches[@]}" >&2
            exit 1
          fi
          aab="${matches[0]}"
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"
          # actions/upload-artifact resolves its `path:` input from the
          # workflow's own working directory (the repository root), not from
          # this job's `defaults.run.working-directory`, so the upload step
          # further down needs the same path spelled out from the repo root.
          # This must always be the exact same file AAB_PATH names above: it
          # is derived from it on the same line the file was found, never
          # rediscovered independently, so the file the signature check
          # verifies and the file that gets uploaded cannot drift apart.
          echo "AAB_REPO_PATH=packages/ludo_client/${aab#./}" >> "$GITHUB_ENV"
          echo "found app bundle: $aab"
          ls -la "$aab"
          stat --format '%n is %s bytes' "$aab"

      # Assert targetSdk, minSdk and the application id from an artefact the
      # build itself produced, not from build.gradle.kts (which only proves
      # the file says what we wrote in it, not what actually got built). The
      # merged manifest AGP writes under the build intermediates is plain XML
      # and carries all three. Its exact path is an AGP implementation
      # detail, so it is located with `find`, and this step fails loudly, not
      # silently, if no such file exists -- a grep over a missing path must
      # never report green having checked nothing.
      - name: assert the shipped SDK numbers and application id
        run: |
          set -euo pipefail
          manifest="$(find . -path '*intermediates*merged_manifest*/release/AndroidManifest.xml' -print -quit)"
          if [ -z "$manifest" ]; then
            manifest="$(find . -path '*intermediates*' -iname 'AndroidManifest.xml' | grep -i release | head -n1)"
          fi
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "no merged manifest found under packages/ludo_client/build; cannot assert the shipped values, failing rather than passing vacuously" >&2
            find . -iname 'AndroidManifest.xml' >&2 || true
            exit 1
          fi
          echo "reading $manifest"
          cat "$manifest"

          grep -q 'package="app.fayad.ludo"' "$manifest" || {
            echo "application id app.fayad.ludo not found in $manifest" >&2
            exit 1
          }
          grep -Eq 'targetSdkVersion="36"|android:targetSdkVersion="36"' "$manifest" || {
            echo "targetSdk 36 not found in $manifest" >&2
            exit 1
          }
          grep -Eq 'minSdkVersion="24"|android:minSdkVersion="24"' "$manifest" || {
            echo "minSdk 24 not found in $manifest" >&2
            exit 1
          }
          # The release build has no INTERNET permission unless the MAIN
          # manifest declares it: Flutter's scaffolding puts it only in the
          # debug and profile manifests, so every local run connects and the
          # shipped artifact cannot open a socket at all. Version code 2 went
          # to closed testing that way and answered every Create Room with
          # "failed to connect to server". This asserts it from the merged
          # RELEASE manifest, which is the only artefact that proves what
          # actually ships.
          grep -q 'android.permission.INTERNET' "$manifest" || {
            echo "android.permission.INTERNET is missing from the merged release manifest; the shipped app would not be able to open a socket" >&2
            exit 1
          }
          # The same shape of defect one layer along. An app targeting API
          # 30 or above only sees the activities it declares a <queries>
          # entry for, so a merged manifest with no VIEW/https query has no
          # browser to hand game_over's verify_url to: url_launcher returns
          # false and the winner is told the link could not be opened.
          # url_launcher_android declares no queries of its own, so this can
          # only come from the app manifest, and nothing in a debug run or a
          # widget test would notice it missing. Both lines have to be there:
          # the action alone would pass against the PROCESS_TEXT query the
          # Flutter template ships.
          python3 - "$manifest" <<'PY' || exit 1
          import re, sys
          xml = open(sys.argv[1], encoding='utf-8').read()
          intents = [i for b in re.findall(r'<queries>.*?</queries>', xml, re.S)
                       for i in re.findall(r'<intent>.*?</intent>', b, re.S)]
          ok = any('android.intent.action.VIEW' in i and 'scheme="https"' in i
                   for i in intents)
          if not ok:
              print('no <queries> block in the merged release manifest declares '
                    'a VIEW intent for the https scheme; the shipped app cannot '
                    'resolve a browser for verify_url', file=sys.stderr)
              sys.exit(1)
          print('confirmed: the merged release manifest queries VIEW/https')
          PY
          echo "confirmed from the build's own merged manifest: applicationId=app.fayad.ludo, targetSdk=36, minSdk=24, INTERNET granted"

      # Guarded the same way the signing material was written: only runs
      # when the keystore secret is present. This step is the difference
      # between "the release build type compiles" and "this artifact is
      # signed with the key Play expects", and it is written so that it
      # cannot pass without actually checking. Two preconditions are checked
      # first (AAB_PATH empty because the previous step found nothing;
      # LUDO_UPLOAD_CERT_SHA256 unset because there would be nothing to
      # compare against), then the four ways the certificate check itself
      # can fail each print which one it was:
      #   1. keytool missing              -- cannot run the check at all
      #   2. keytool ran but errored      -- cannot read the bundle's signer
      #   3. keytool ran, no SHA256 line  -- bundle looks unsigned
      #   4. keytool ran, fingerprint present, mismatch -- wrong key
      # Cases 2-3 used to share one line: `actual="$(keytool ... | grep ...)"`
      # under `set -euo pipefail`. When grep matched nothing that whole
      # pipeline failed as a unit and `set -e` ended the step right there,
      # before the "no SHA-256 line" message below it could ever print --
      # the job still failed, correctly, but with no explanation. Each
      # command that can legitimately fail is now checked on its own, with
      # its own message, so the step cannot die silently. The comparison
      # never prints either fingerprint, expected or actual, into the log:
      # the expected one is a secret and GitHub would redact it anyway, and
      # printing the actual one on a mismatch would hand someone a value to
      # paste into the secret to make the check stop complaining, which
      # defeats it entirely.
      - name: verify the release bundle is signed with the expected upload certificate
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          LUDO_UPLOAD_CERT_SHA256: ${{ secrets.LUDO_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${AAB_PATH:-}" ]; then
            echo "AAB_PATH is empty; the locate-the-app-bundle step did not find a bundle, refusing to skip the signature check" >&2
            exit 1
          fi
          if [ -z "${LUDO_UPLOAD_CERT_SHA256:-}" ]; then
            echo "LUDO_UPLOAD_CERT_SHA256 is not set even though the keystore secret is present; refusing to upload a bundle whose signer cannot be checked" >&2
            exit 1
          fi
          if ! command -v keytool >/dev/null 2>&1; then
            echo "keytool is not on PATH on this runner; cannot verify the bundle's signer, refusing to upload an unverified bundle" >&2
            exit 1
          fi
          if ! cert_output="$(keytool -printcert -jarfile "$AAB_PATH" 2>&1)"; then
            echo "keytool -printcert -jarfile exited with an error against $AAB_PATH; cannot verify the bundle's signer, refusing to upload it" >&2
            exit 1
          fi
          actual="$(printf '%s\n' "$cert_output" | grep -i 'SHA256:' | head -n1 | sed -E 's/^.*SHA256: *//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]' || true)"
          if [ -z "$actual" ]; then
            echo "keytool -printcert -jarfile produced no SHA-256 line; the bundle appears to be unsigned, refusing to upload it" >&2
            exit 1
          fi
          expected="$(printf '%s' "$LUDO_UPLOAD_CERT_SHA256" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$expected" ]; then
            echo "the release bundle's signer certificate does not match LUDO_UPLOAD_CERT_SHA256; it is not signed with the expected upload key, refusing to upload it" >&2
            exit 1
          fi
          echo "confirmed: $AAB_PATH is signed by the expected upload certificate"

      # Only reached when the keystore secret was present and the signature
      # above checked out, so nothing that lands here is debug-signed.
      - name: upload signed release bundle
        if: steps.signing.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ludo-release-appbundle
          path: ${{ env.AAB_REPO_PATH }}
          if-no-files-found: error
          retention-days: 14
