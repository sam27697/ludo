name: device-smoke

# Two triggers: workflow_dispatch for an on-demand run, and a daily schedule
# so this stops depending on somebody remembering to press the button --
# exactly the gap run 34 exposed, this workflow having sat unrun from the day
# it was written until it was dispatched by hand. Measured on that run
# (33793895304, main, 8e65d39): sam27697/ludo is a public repository, so
# GitHub-hosted Actions minutes are not metered against Sam here at all, and
# the whole job -- emulator boot included -- finished in 7m27s. That removes
# the cost argument for staying manual. It does not remove the reason this
# still has no business on verify.yml's per-push path: every order in this
# project is judged against verify.yml, and an eight-minute emulator boot in
# that loop would slow every single review. Daily is the balance struck by
# order 115 -- it catches a platform regression within a day without
# touching the gate every order waits on. Pick a time off the hour and off
# minute 0 for the cron, because GitHub queues an enormous number of jobs at
# those times and delays them.
#
# This workflow answers one question screenshots.yml never has: does the
# app actually start, and reach its first screen, on the API level it ships
# against (targetSdk 36 -- see
# packages/ludo_client/android/app/build.gradle.kts and the "client" job in
# verify.yml, which confirms that level from the build's own merged
# manifest). Order 112 exists because nothing in this repository had ever
# watched that happen. Order 115 adds the schedule above, and turns the App
# Link measurement below into an actual gate on whether a measurement
# happened at all -- not on the state it reports, which stays informational.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "37 2 * * *"

jobs:
  device-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ludo_client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: "stable"

      - run: flutter pub get

      # Cheap check before the expensive one, same reasoning as the matching
      # step in screenshots.yml: the emulator step below takes minutes to
      # boot, and this catches a moved or misspelled driver/target path in
      # seconds instead of at the end of that boot. Runs under this job's
      # own working-directory (packages/ludo_client), so the paths here are
      # relative to that, not to the repository root.
      - name: confirm the drive script and target exist
        run: |
          set -euo pipefail
          test -f test_driver/integration_test.dart || { echo "missing packages/ludo_client/test_driver/integration_test.dart" >&2; exit 1; }
          test -f integration_test/launch_smoke_test.dart || { echo "missing packages/ludo_client/integration_test/launch_smoke_test.dart" >&2; exit 1; }

      # Same boilerplate as screenshots.yml, taken from
      # reactivecircus/android-emulator-runner's own README for
      # GitHub-hosted Linux runners: makes /dev/kvm group-writable so the
      # emulator gets hardware acceleration instead of falling back to
      # software rendering, which is slow enough to risk the job timing
      # out.
      - name: enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # api-level: 36 is Android 16, the exact platform targetSdk 36 ships
      # against -- the level order 112 exists to prove the app actually
      # boots on, not merely compiles against. This has not been booted by
      # the worker that wrote this workflow: there is no Android SDK in that
      # worker's container, and installing one there is forbidden by order
      # 112 itself. If the runner cannot fetch a google_apis x86_64 system
      # image at this level (order 112 names this as a real possibility),
      # the "boot the emulator" step below fails with whatever error
      # sdkmanager/avdmanager produce, and that is the honest result this
      # run reports -- nothing here silently retries at a lower level and
      # calls it API 36.
      #
      # target: google_apis, arch: x86_64, profile: "Nexus 5": the same
      # three values screenshots.yml uses at API 34, kept for consistency
      # rather than for any requirement of this test. x86_64 in particular
      # is what /dev/kvm above accelerates; an arm64 image on this runner's
      # x86_64 host would fall back to software emulation.
      - name: boot the emulator and run the launch smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: "Nexus 5"
          disable-animations: true
          # This whole block folds to a single line (YAML `>-`), which
          # matters here for the same reason it does in screenshots.yml:
          # android-emulator-runner hands each line of `script:` to its own
          # `sh -c`, so anything meant to share a shell -- the `cd` below,
          # capturing flutter drive's exit code, reinstalling the apk it
          # just built, and deciding whether the measurement that follows
          # actually measured anything -- has to live on one physical line
          # or the later parts would never see what the earlier parts set.
          # Every source line below must sit at this same indentation:
          # YAML's own folding rule for `>-` only turns a line break into a
          # space when the next line is indented no more than this one is;
          # a line indented even one column further keeps its leading
          # newline instead of folding, which would silently hand that line
          # to its own `sh -c` the same as an actual blank line would. The
          # `if` blocks near the end are written unindented for exactly this
          # reason, not for lack of style.
          #
          # Sequence, in order:
          #  1. cd into the client package (this action ignores the job's
          #     own working-directory default; screenshots.yml documents
          #     this at length, no need to repeat it here).
          #  2. echo the api level and device name, so a failed run states
          #     plainly what it was even attempting -- order 112 asks for
          #     this explicitly.
          #  3. `set +e` before flutter drive, and left off for the rest of
          #     the script (nothing here turns it back on): no command after
          #     this point is allowed to end the script early just by
          #     failing, because most of what is left to run -- the
          #     reinstall, the app-links measurement, and the logcat dump --
          #     are exactly the things that still need to happen when an
          #     earlier command failed. The three places a failure is
          #     actually allowed to end the job are the explicit
          #     `exit "$DRIVE_EXIT"` in step 10, `exit "$MEASURE_EXIT"` in
          #     step 11, and `exit "$PROBE_EXIT"` in step 12, all below.
          #     (POSIX sh, not bash: `+e`/`-e` are portable, `set -o
          #     pipefail` and `[[` are not, so neither is used anywhere in
          #     this script.) `--profile`, not `--release` or the debug
          #     default: `flutter drive` builds debug unless told otherwise,
          #     and debug is not being judged here, but `--release` strips
          #     the Dart VM service the driver needs to talk to the running
          #     app, which would break the connection before the test could
          #     run at all. Profile mode keeps the VM service and is the
          #     same choice screenshots.yml makes for the same reason.
          #  4. capture that exit code in DRIVE_EXIT -- this is the gate for
          #     the smoke test itself, checked explicitly in step 10, not
          #     left to errexit.
          #  5. reinstall the apk `flutter drive` just built, from
          #     build/app/outputs/flutter-apk/app-profile.apk (already on
          #     disk, no rebuild). This step exists because run 33793895304
          #     measured that `flutter drive` uninstalls the app when it
          #     finishes, so by the time step 6 asked, there was no package
          #     left to ask about: `pm get-app-links` answered "Error:
          #     package app.fayad.ludo unavailable" and the dumpsys fallback
          #     answered nothing, because both were asking about a package
          #     that was already gone. The reinstall's own exit status is
          #     recorded in INSTALL_EXIT for the step log but is not itself
          #     a gate -- a failed reinstall shows up as an unreadable
          #     measurement in step 7 instead, which step 7 does treat as a
          #     gate.
          #  6. measure App Link state with `pm get-app-links` and, as a
          #     fallback if that prints nothing useful, the domain
          #     verification section of `dumpsys package`. Both commands'
          #     output is captured to a variable and echoed either way, so
          #     the step log always shows what was measured.
          #  7. decide whether the measurement itself succeeded. Any
          #     domain-verification state pm or dumpsys can print --
          #     verified, unverified, none, legacy_failure, a numeric state,
          #     or a dumpsys "Domain verification" block naming the domain
          #     in any state -- counts as success and is a report, not a
          #     gate; the app is expected to read unverified until a signed
          #     bundle reaches a Play track and assetlinks.json starts
          #     answering, and that is not this workflow's business.
          #     Failure is a measurement that produced nothing readable:
          #     `pm get-app-links` answering "Error: ... unavailable" (or
          #     anything else with no state in it) while the dumpsys
          #     fallback also came back empty. That failure is recorded in
          #     MEASURE_EXIT and acted on in step 11, after step 10, with a
          #     message naming what came back empty and what INSTALL_EXIT
          #     was, so a red run here does not require re-deriving this
          #     order to understand.
          #  8. build the real app: `flutter build apk --profile`, which
          #     overwrites build/app/outputs/flutter-apk/app-profile.apk --
          #     the same path step 5 reinstalled from -- with app.fayad.ludo
          #     built from lib/main.dart instead of from the apk flutter
          #     drive built. The drive apk's entry point is
          #     integration_test/launch_smoke_test.dart's own main(), which
          #     pumps LudoApp() with no initial link and no link stream
          #     wired in, so it cannot be the thing step 9's probe measures
          #     (run 36220114933, order 190 RESPEC 1). Capture the build's
          #     exit code in BUILD_EXIT and echo it; if it is zero, install
          #     that apk from the same path. If BUILD_EXIT is nonzero, the
          #     probe does not run at all -- PROBE_EXIT is set to BUILD_EXIT
          #     instead, with one line saying why, so step 12 still reports
          #     the real failure.
          #  9. if BUILD_EXIT was zero, run tool/device_link_probe.sh: it
          #     delivers a room link to the reinstalled app cold, then warm,
          #     and polls uiautomator's dump of the accessibility tree for
          #     the code each time, the same tree Flutter exposes a text
          #     field's contents through. Capture its exit code in
          #     PROBE_EXIT and echo it, the same pattern step 4 uses for
          #     DRIVE_EXIT. Order 190.
          #  10. if DRIVE_EXIT was nonzero, dump adb logcat -- both to this
          #     step's own log and to a file under packages/ludo_client so
          #     the upload-artifact step below has something to attach --
          #     then exit with that same code so the job goes red for the
          #     actual reason (the smoke test failing), not for a step that
          #     silently swallowed it.
          #  11. if step 7 found no usable measurement, exit with
          #     MEASURE_EXIT. This only runs when DRIVE_EXIT was zero --
          #     step 10 above already exited otherwise -- so a run never
          #     reports two different failures for one red job.
          #  12. if PROBE_EXIT is nonzero -- set either by step 8's build
          #     failing or step 9's probe failing -- exit with PROBE_EXIT.
          #     This only runs when DRIVE_EXIT and MEASURE_EXIT were both
          #     zero -- steps 10 and 11 above already exited otherwise.
          script: >-
            cd packages/ludo_client &&
            echo "device-smoke: api-level 36 (Android 16), device emulator-5554, profile Nexus 5, target google_apis" &&
            set +e;
            flutter drive --profile --driver=test_driver/integration_test.dart --target=integration_test/launch_smoke_test.dart -d emulator-5554;
            DRIVE_EXIT=$?;
            echo "device-smoke: flutter drive exit code $DRIVE_EXIT";
            echo "device-smoke: reinstalling app-profile.apk so the app-links measurement below has a package to ask about (flutter drive uninstalls it on exit)";
            adb install -r build/app/outputs/flutter-apk/app-profile.apk;
            INSTALL_EXIT=$?;
            echo "device-smoke: reinstall exit code $INSTALL_EXIT";
            echo "device-smoke: App Link state for app.fayad.ludo";
            APP_LINKS=$(adb shell pm get-app-links app.fayad.ludo 2>&1);
            echo "$APP_LINKS";
            echo "device-smoke: domain verification section of dumpsys package (fallback if the line above printed nothing useful)";
            DOMAIN_VERIFICATION=$(adb shell dumpsys package app.fayad.ludo 2>&1 | sed -n '/Domain verification/,/^$/p');
            echo "$DOMAIN_VERIFICATION";
            APP_LINKS_OK=1;
            if [ -z "$APP_LINKS" ]; then APP_LINKS_OK=0; fi;
            if printf '%s' "$APP_LINKS" | grep -qE 'Error:|unavailable'; then APP_LINKS_OK=0; fi;
            DOMAIN_VERIFICATION_OK=1;
            if [ -z "$DOMAIN_VERIFICATION" ]; then DOMAIN_VERIFICATION_OK=0; fi;
            MEASURE_OK=0;
            if [ "$APP_LINKS_OK" -eq 1 ]; then MEASURE_OK=1; fi;
            if [ "$DOMAIN_VERIFICATION_OK" -eq 1 ]; then MEASURE_OK=1; fi;
            MEASURE_EXIT=0;
            if [ "$MEASURE_OK" -eq 0 ]; then echo "device-smoke: App Link measurement produced no usable state -- pm get-app-links returned [$APP_LINKS], the dumpsys domain-verification fallback returned [$DOMAIN_VERIFICATION], and the reinstall exited $INSTALL_EXIT -- see order 115" >&2; MEASURE_EXIT=1; fi;
            echo "device-smoke: building app.fayad.ludo from lib/main.dart for the device link probe -- the apk flutter drive built and step 5 reinstalled has no initial link and no link stream wired in, see order 190 RESPEC 1";
            flutter build apk --profile;
            BUILD_EXIT=$?;
            echo "device-smoke: flutter build apk --profile exit code $BUILD_EXIT";
            if [ "$BUILD_EXIT" -eq 0 ]; then
            adb install -r build/app/outputs/flutter-apk/app-profile.apk;
            PROBE_INSTALL_EXIT=$?;
            echo "device-smoke: probe apk reinstall exit code $PROBE_INSTALL_EXIT";
            fi;
            if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "device-smoke: device link probe did not run -- flutter build apk --profile failed with exit $BUILD_EXIT";
            PROBE_EXIT="$BUILD_EXIT";
            else
            sh tool/device_link_probe.sh;
            PROBE_EXIT=$?;
            echo "device-smoke: device link probe exit code $PROBE_EXIT";
            fi;
            if [ "$DRIVE_EXIT" -ne 0 ]; then
            echo "device-smoke: flutter drive failed with exit $DRIVE_EXIT -- dumping adb logcat" >&2;
            adb logcat -d | tee device-smoke-logcat.txt 1>&2;
            exit "$DRIVE_EXIT";
            fi;
            if [ "$MEASURE_EXIT" -ne 0 ]; then
            exit "$MEASURE_EXIT";
            fi;
            if [ "$PROBE_EXIT" -ne 0 ]; then
            exit "$PROBE_EXIT";
            fi

      # Only present when the step above actually wrote it, which only
      # happens when DRIVE_EXIT was nonzero -- so this has something to
      # upload exactly when there is something worth reading, and
      # if-no-files-found is `warn` rather than `error` for the same reason
      # screenshots.yml's equivalent upload uses `warn`: a passing run
      # having nothing to attach here is the expected case, not a second,
      # differently-worded failure for the job to also report.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-smoke-logcat
          path: packages/ludo_client/device-smoke-logcat.txt
          if-no-files-found: warn

      # Present on every run, pass or fail: step 8 above (order 190) writes
      # both screenshots and both accessibility dumps whether or not it
      # found the code. if-no-files-found is `warn` for the same reason as
      # the logcat upload above.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-link-probe
          path: |
            packages/ludo_client/link-*.png
            packages/ludo_client/link-*.xml
          if-no-files-found: warn
