<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludo RNG - This invite link looks cut off</title>
<style>
html {
  background: #0A3D38;
}
body {
  margin: 0;
  min-height: 100vh;
  box-sizing: border-box;
  padding: 1rem;
  background: linear-gradient(160deg, #0A3D38, #14665C);
  color: #0A2A27;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.card {
  box-sizing: border-box;
  max-width: 28rem;
  margin: 0 auto;
  padding: 1.5rem 1.25rem;
  background: #F7FBFA;
  border-radius: 1.25rem;
  text-align: center;
}
.seats {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
}
.seats span {
  width: 0.875rem;
  height: 0.875rem;
  border-radius: 50%;
}
.seats .red { background: #D32F2F; }
.seats .green { background: #388E3C; }
.seats .yellow { background: #FBC02D; }
.seats .blue { background: #1976D2; }
h1 {
  margin: 1rem 0 0.25rem;
  font-size: 1.5rem;
  line-height: 1.25;
}
.lead {
  margin: 0 0 1.25rem;
  font-size: 1.0625rem;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 100%;
  min-height: 3rem;
  padding: 0.5rem 1rem;
  border-radius: 0.75rem;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}
.btn:focus-visible, .switch:focus-visible {
  outline: 3px solid #1976D2;
  outline-offset: 2px;
}
#get-app {
  min-height: 3.5rem;
  background: #0F6B5F;
  border: 2px solid #0F6B5F;
  color: #F7FBFA;
  font-size: 1.25rem;
}
.fair {
  margin: 1rem 0 0;
  font-size: 0.875rem;
}
.switch {
  display: inline-flex;
  align-items: center;
  min-height: 3rem;
  padding: 0 0.75rem;
  color: #0F6B5F;
}
</style>
</head>
<body>
<main class="card">
<div class="seats" aria-hidden="true"><span class="red"></span><span class="green"></span><span class="yellow"></span><span class="blue"></span></div>
<h1>This invite link looks cut off</h1>
<p class="lead">Ask your friend to send the link again, or open Ludo RNG and type the room code they give you.</p>
<a id="get-app" class="btn" href="https://play.google.com/store/apps/details?id=app.fayad.ludo">Get Ludo RNG on Google Play</a>
<a id="home" class="switch" href="/">Ludo RNG home</a>
<a id="lang-switch" class="switch" href="?lang=ar" hreflang="ar" lang="ar">العربية</a>
</main>
</body>
</html>
